<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>Shadow Hunters</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="lobby" class="screen">
    <div class="logo">
      <h1>SHADOW<br>HUNTERS</h1>
      <p class="subtitle">Ẩn danh • Sinh tồn • Phán xét</p>
    </div>
    <div class="form-card">
      <input id="playerName" type="text" placeholder="Tên của bạn" maxlength="16" autocomplete="off" />
      <button id="btnCreate" class="btn primary">Tạo phòng</button>
      <div class="or">hoặc</div>
      <input id="roomCode" type="text" placeholder="Mã phòng" maxlength="6" autocomplete="off" style="text-transform:uppercase" />
      <button id="btnJoin" class="btn">Vào phòng</button>
    </div>
    <p class="hint">4–8 người chơi • Màn hình dọc điện thoại</p>
  </div>

  <div id="room" class="screen hidden">
    <header class="topbar">
      <span id="roomIdLabel">PHÒNG</span>
      <button id="btnCopy" class="btn-sm">Sao chép mã</button>
    </header>
    <div id="playerList" class="player-list"></div>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Nhập tin nhắn..." maxlength="120" />
      <button id="btnChat" class="btn-sm">Gửi</button>
    </div>
    <button id="btnStart" class="btn primary full hidden">Bắt đầu game</button>
    <p id="waitMsg" class="hint">Chờ chủ phòng bắt đầu (tối thiểu 4 người)...</p>
    <button id="btnLeaveRoom" class="btn full" style="background:#444;margin-top:8px">Thoát phòng</button>
  </div>

  <div id="game" class="screen hidden">
    <div class="game-header">
      <div id="turnInfo" class="turn-info">Lượt: —</div>
      <div class="header-btns">
        <button id="btnReveal" class="btn-sm danger">Tiết lộ nhân vật</button>
        <button id="btnLeaveGame" class="btn-sm" style="background:#555">Thoát</button>
      </div>
    </div>
    <div id="myCard" class="my-card">
      <div class="char-name" id="myCharName">?</div>
      <div class="char-meta">
        <span id="myFaction"></span>
        <span id="myHp"></span>
      </div>
      <div class="char-win" id="myWin"></div>
      <div class="char-ability" id="myAbility"></div>
    </div>
    <div id="board" class="board"></div>
    <div id="playersStrip" class="players-strip"></div>
    <div id="actionPanel" class="action-panel">
      <div id="actionButtons" class="action-buttons"></div>
      <div id="pendingPanel" class="pending-panel hidden"></div>
    </div>
    <div id="gameLog" class="game-log"></div>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">Chọn</h3>
        <div id="modalBody"></div>
        <button id="modalClose" class="btn full">Đóng</button>
      </div>
    </div>
    <div id="winOverlay" class="win-overlay hidden">
      <h2>🎉 Kết thúc!</h2>
      <div id="winNames"></div>
      <button id="btnPlayAgain" class="btn primary">Chơi lại (cùng phòng)</button>
      <button id="btnNewRoom" class="btn">Tạo / vào phòng mới</button>
      <button id="btnLeaveAfter" class="btn" style="background:#444">Thoát về màn hình chính</button>
    </div>
  </div>

  <div id="diceOverlay" class="dice-overlay hidden">
    <div class="dice-box">
      <div class="dice-label" id="diceLabel">Đang tung xúc xắc...</div>
      <div class="dice-row">
        <div class="die-wrap">
          <div class="die-caption">D6</div>
          <div class="die d6" id="die6">?</div>
        </div>
        <div class="die-wrap">
          <div class="die-caption">D4</div>
          <div class="die d4" id="die4">?</div>
        </div>
      </div>
      <div class="dice-total" id="diceTotal"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
